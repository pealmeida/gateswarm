name: Benchmark snapshot

on:
  schedule:
    # Mondays 09:00 UTC (~06:00 BRT)
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install collector dependencies
        run: |
          pip install pyyaml pandas huggingface_hub

      - name: Run benchmark collector
        env:
          AA_API_KEY: ${{ secrets.AA_API_KEY }}
        run: bash scripts/benchmarks/collect.sh

      - name: Open PR with snapshot changes
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'chore(benchmarks): refresh public snapshot'
          title: 'chore(benchmarks): refresh public snapshot'
          body: |
            Automated weekly benchmark snapshot (LMArena HF dataset, optional AA API).
            LiveBench / Terminal-Bench are excluded from the public snapshot until license confirmation.

            **Review checklist**
            - Every observation has `source_url` and `source_date`
            - No LiveBench / Terminal-Bench rows in `snapshot.json`
            - `snapshot.meta.json` SHA matches `snapshot.json`
          branch: automation/benchmarks-snapshot
          delete-branch: true
